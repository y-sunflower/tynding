[package]
name = "tynding"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
crate-type = ["staticlib"]
name = "tynding"

[dependencies]
extendr-api = { git = "https://github.com/extendr/extendr.git", rev = "2937d4ec1b9529174a920f7a9a019ff6b9d16aa4" }
typst = "0.14.2"
typst-as-lib = { version = "0.15.4", features = ["typst-html"] }
typst-html = "0.14.2"
typst-kit = { version = "0.14.2", default-features = false, features = [
  "embed-fonts",
  "fonts"
] }
typst-pdf = "0.14.2"
typst-render = "0.14.2"
typst-svg = "0.14.2"
typst-syntax = "0.14.2"

[profile.release]
lto = true
codegen-units = 1
